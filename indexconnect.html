<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PoteChat - Firebase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Liens SDK Firebase (compatibles CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- ÉCRAN D'AUTHENTIFICATION -->
    <div id="auth-screen" class="flex flex-col justify-center items-center h-full p-6 bg-white">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">PoteChat 🚀</h1>
        <p class="text-gray-500 mb-6 text-center">Version Firebase, 100% gratuit.</p>
        <input type="email" id="email" placeholder="Email" class="w-full max-w-sm p-3 mb-3 border rounded-xl focus:outline-indigo-600">
        <input type="password" id="password" placeholder="Mot de passe" class="w-full max-w-sm p-3 mb-4 border rounded-xl focus:outline-indigo-600">
        <button onclick="handleAuth('login')" class="w-full max-w-sm bg-indigo-600 text-white p-3 rounded-xl font-semibold mb-2 shadow-md">Se connecter</button>
        <button onclick="handleAuth('signup')" class="w-full max-w-sm bg-gray-200 text-gray-800 p-3 rounded-xl font-semibold">Créer un compte</button>
    </div>

    <!-- ÉCRAN DE DISCUSSION -->
    <div id="chat-screen" class="hidden flex flex-col h-full">
        <!-- En-tête -->
        <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
            <h1 class="font-bold text-lg text-gray-800">💬 Le Chat des Potes</h1>
            <button onclick="logout()" class="text-sm text-red-500 font-medium">Déconnexion</button>
        </header>

        <!-- Liste des messages -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
            <!-- Les messages s'ajouteront dynamiquement ici -->
        </div>

        <!-- Formulaire d'envoi -->
        <form id="chat-form" onsubmit="sendMessage(event)" class="bg-white border-t p-3 flex gap-2">
            <input type="text" id="message-input" placeholder="Écris un message..." autocomplete="off" class="flex-1 p-3 border rounded-full focus:outline-indigo-600 text-sm">
            <button type="submit" class="bg-indigo-600 text-white px-5 rounded-full font-semibold text-sm shadow-md">Envoyer</button>
        </form>
    </div>

    <!-- Script Logique Firebase -->
    <script>
        // TODO: Remplacez ces valeurs par la configuration de votre projet Firebase
        // (Trouvable dans les Paramètres du projet > Général > Vos applications > SDK Firebase)
        const firebaseConfig = {
  apiKey: "AIzaSyAjZrcr430nF9eklDSpQEKSKZDvRYYNI_Y",
  authDomain: "connectmessenger-41ac8.firebaseapp.com",
  projectId: "connectmessenger-41ac8",
  storageBucket: "connectmessenger-41ac8.firebasestorage.app",
  messagingSenderId: "691375453229",
  appId: "1:691375453229:web:9ada6b088fb2185eee34a4"
};

        // Initialisation de Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');

        let currentUser = null;

        // Observer l'état de la connexion utilisateur
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showChat();
            } else {
                currentUser = null;
                chatScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });

        // Gérer Connexion / Inscription
        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (type === 'signup') {
                    await auth.createUserWithEmailAndPassword(email, password);
                    alert('Compte créé avec succès !');
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (error) {
                alert(error.message);
            }
        }

        async function logout() {
            await auth.signOut();
        }

        // Afficher l'écran de chat et écouter les messages en temps réel
        function showChat() {
            authScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            listenToMessages();
        }

        // Écouter Firestore en temps réel (instantané)
        function listenToMessages() {
            db.collection('messages')
                .orderBy('createdAt', 'asc')
                .onSnapshot(snapshot => {
                    messagesContainer.innerHTML = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isMe = msg.userId === currentUser.uid;
                        
                        const div = document.createElement('div');
                        div.className = `max-w-[75%] p-3 rounded-2xl text-sm ${isMe ? 'bg-indigo-600 text-white self-end rounded-br-none' : 'bg-white text-gray-800 self-start border rounded-bl-none shadow-sm'}`;
                        div.textContent = msg.content;
                        messagesContainer.appendChild(div);
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
        }

        // Envoyer un message dans Firestore
        async function sendMessage(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            try {
                await db.collection('messages').add({
                    content: text,
                    userId: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                messageInput.value = '';
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
</html>
