<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conect Messenger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              bg: '#09090b',
              card: '#121215',
              border: '#27272a',
              hover: '#1c1c21',
              chat: '#18181b'
            }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="bg-dark-bg text-zinc-100 font-sans h-screen overflow-hidden flex flex-col md:flex-row">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-dark-bg flex items-center justify-center p-4">
    <div class="bg-dark-card border border-dark-border p-8 rounded-2xl w-full max-w-md shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold tracking-wider bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 bg-clip-text text-transparent">CONECT</h1>
        <p class="text-zinc-400 text-sm mt-2">Connectez-vous pour commencer à chatter</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Pseudo / Nom</label>
          <input type="text" id="auth-username" placeholder="ex: alex_dev" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Mot de passe</label>
          <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
        </div>

        <button id="btn-login" onclick="handleAuth('login')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
          Se connecter
        </button>
        <button id="btn-register" onclick="handleAuth('register')" class="w-full bg-transparent border border-dark-border hover:bg-dark-hover text-zinc-300 font-semibold py-3 rounded-xl transition">
          Créer un compte
        </button>
      </div>

      <div id="auth-error" class="mt-4 text-center text-xs text-red-500 hidden"></div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-screen" class="flex-1 flex h-full w-full hidden relative">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-dark-card border-r border-dark-border flex flex-col h-full flex-shrink-0 z-20">
      <!-- HEADER -->
      <div class="p-4 border-b border-dark-border flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="relative">
            <img id="my-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="w-10 h-10 rounded-full bg-dark-border p-0.5 object-cover">
            <span class="w-3 h-3 bg-emerald-500 border-2 border-dark-card rounded-full absolute bottom-0 right-0"></span>
          </div>
          <div>
            <h2 id="my-username" class="font-bold text-sm leading-tight text-zinc-100">...</h2>
            <span class="text-xs text-zinc-500">En ligne</span>
          </div>
        </div>
        <div class="flex items-center space-x-1">
          <button onclick="openNewChatModal()" class="p-2 text-zinc-400 hover:text-white hover:bg-dark-hover rounded-xl transition" title="Nouvelle conversation">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button onclick="logout()" class="p-2 text-zinc-400 hover:text-red-400 hover:bg-dark-hover rounded-xl transition" title="Déconnexion">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <!-- SEARCH BAR -->
      <div class="p-3 border-b border-dark-border">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-zinc-500"></i>
          <input type="text" id="search-chat-input" onkeyup="filterChats()" placeholder="Rechercher une discussion..." class="w-full bg-dark-bg border border-dark-border rounded-xl pl-9 pr-4 py-2 text-xs focus:outline-none focus:border-indigo-500 text-zinc-200">
        </div>
      </div>

      <!-- CONVERSATION LIST -->
      <div id="chats-list" class="flex-1 overflow-y-auto divide-y divide-dark-border/50">
        <div class="p-8 text-center text-zinc-500 text-xs">
          Chargement des discussions...
        </div>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main id="chat-area" class="flex-1 flex flex-col h-full bg-dark-bg absolute md:relative inset-0 z-10 translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
      
      <!-- DEFAULT EMPTY STATE -->
      <div id="no-chat-selected" class="flex-1 flex flex-col items-center justify-center p-8 text-center">
        <div class="w-20 h-20 rounded-full bg-dark-card border border-dark-border flex items-center justify-center text-indigo-500 text-3xl mb-4 shadow-xl">
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <h3 class="text-lg font-bold text-zinc-200">Vos Messages</h3>
        <p class="text-xs text-zinc-500 max-w-xs mt-1">Sélectionnez un contact pour commencer à discuter en temps réel.</p>
        <button onclick="openNewChatModal()" class="mt-5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition">
          Démarrer une discussion
        </button>
      </div>

      <!-- ACTIVE CHAT CONTENT -->
      <div id="active-chat-container" class="flex-1 flex flex-col h-full hidden">
        <!-- CHAT HEADER -->
        <div class="p-3 md:p-4 border-b border-dark-border bg-dark-card/50 backdrop-blur-md flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <button onclick="closeMobileChat()" class="md:hidden p-2 text-zinc-400 hover:text-white">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="relative">
              <img id="chat-user-avatar" src="" class="w-10 h-10 rounded-full bg-dark-border object-cover">
            </div>
            <div>
              <h3 id="chat-user-name" class="font-bold text-sm text-zinc-100">...</h3>
              <p id="chat-user-status" class="text-xs text-zinc-500">Membre Conect</p>
            </div>
          </div>
        </div>

        <!-- MESSAGES CONTAINER -->
        <div id="messages-list" class="flex-1 overflow-y-auto p-4 space-y-3">
          <!-- Messages dynamically inserted here -->
        </div>

        <!-- MESSAGE INPUT -->
        <div class="p-3 md:p-4 border-t border-dark-border bg-dark-card">
          <form id="message-form" onsubmit="sendMessage(event)" class="flex items-center space-x-2">
            <label class="p-2.5 text-zinc-400 hover:text-indigo-400 hover:bg-dark-hover rounded-xl cursor-pointer transition">
              <i class="fa-solid fa-image"></i>
              <input type="file" id="image-input" accept="image/*" class="hidden" onchange="sendImage(event)">
            </label>
            <input type="text" id="message-input" placeholder="Écrivez votre message..." class="flex-1 bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-zinc-100">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl transition flex items-center justify-center w-10 h-10">
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>

  <!-- NEW CHAT MODAL -->
  <div id="new-chat-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-4 border-b border-dark-border">
        <h3 class="font-bold text-base text-zinc-100">Nouveau message</h3>
        <button onclick="closeNewChatModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="py-4">
        <input type="text" id="search-user-modal" onkeyup="searchUsers()" placeholder="Rechercher un membre par pseudo..." class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-zinc-100">
      </div>
      <div id="modal-users-list" class="flex-1 overflow-y-auto space-y-1 divide-y divide-dark-border/40">
        <p class="text-xs text-zinc-500 text-center py-4">Saisissez un pseudo pour commencer la recherche.</p>
      </div>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAjZrcr430nF9eklDSpQEKSKZDvRYYNI_Y",
      authDomain: "connectmessenger-41ac8.firebaseapp.com",
      projectId: "connectmessenger-41ac8",
      storageBucket: "connectmessenger-41ac8.firebasestorage.app",
      messagingSenderId: "691375453229",
      appId: "1:691375453229:web:9ada6b088fb2185eee34a4"
    };

    // Initialisation
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let activeChatId = null;
    let activePeer = null;
    let messagesUnsubscribe = null;

    // Authentification
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          currentUser = userDoc.data();
          document.getElementById('my-username').innerText = currentUser.username;
          document.getElementById('my-avatar').src = currentUser.avatar;
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('app-screen').classList.remove('hidden');
          listenToChats();
        }
      } else {
        currentUser = null;
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    async function handleAuth(mode) {
      const usernameInput = document.getElementById('auth-username').value.trim().toLowerCase();
      const passwordInput = document.getElementById('auth-password').value.trim();
      const errorEl = document.getElementById('auth-error');
      
      errorEl.classList.add('hidden');
      if (!usernameInput || !passwordInput) {
        showError("Veuillez remplir tous les champs.");
        return;
      }

      const email = `${usernameInput}@conect.app`;

      try {
        if (mode === 'register') {
          // Vérification unicité pseudo
          const userCheck = await db.collection('users').where('username', '==', usernameInput).get();
          if (!userCheck.empty) {
            showError("Ce pseudo est déjà pris.");
            return;
          }

          const res = await auth.createUserWithEmailAndPassword(email, passwordInput);
          const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${usernameInput}`;
          
          const userData = {
            uid: res.user.uid,
            username: usernameInput,
            avatar: avatarUrl,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          await db.collection('users').doc(res.user.uid).set(userData);
        } else {
          await auth.signInWithEmailAndPassword(email, passwordInput);
        }
      } catch (err) {
        showError(err.message.includes('user-not-found') || err.message.includes('wrong-password') ? "Identifiants incorrects." : err.message);
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('auth-error');
      errorEl.innerText = msg;
      errorEl.classList.remove('hidden');
    }

    function logout() {
      auth.signOut();
    }

    // Écoute des chats
    function listenToChats() {
      db.collection('chats')
        .where('participants', 'array-contains', currentUser.uid)
        .onSnapshot(async (snapshot) => {
          const chatsList = document.getElementById('chats-list');
          if (snapshot.empty) {
            chatsList.innerHTML = `<p class="text-xs text-zinc-500 text-center py-8">Aucune conversation.<br>Cliquez sur l'icône pour en démarrer une !</p>`;
            return;
          }

          let html = '';
          for (let doc of snapshot.docs) {
            const chat = doc.data();
            const peerId = chat.participants.find(id => id !== currentUser.uid);
            const peerDoc = await db.collection('users').doc(peerId).get();
            const peer = peerDoc.exists ? peerDoc.data() : { username: 'Utilisateur', avatar: '' };

            const isActive = doc.id === activeChatId;

            html += `
              <div onclick="selectChat('${doc.id}', '${peer.uid}', '${peer.username}', '${peer.avatar}')" 
                   class="flex items-center space-x-3 p-3.5 cursor-pointer hover:bg-dark-hover transition ${isActive ? 'bg-dark-hover border-l-2 border-indigo-500' : ''}">
                <img src="${peer.avatar}" class="w-11 h-11 rounded-full bg-dark-border object-cover flex-shrink-0">
                <div class="flex-1 min-w-0">
                  <div class="flex justify-between items-baseline mb-1">
                    <h4 class="font-semibold text-xs text-zinc-200 truncate">${peer.username}</h4>
                    <span class="text-[10px] text-zinc-500">${chat.updatedAt ? formatDate(chat.updatedAt.toDate()) : ''}</span>
                  </div>
                  <p class="text-xs text-zinc-400 truncate">${chat.lastMessage || 'Aucun message'}</p>
                </div>
              </div>
            `;
          }
          chatsList.innerHTML = html;
        });
    }

    // Sélection d'une conversation
    function selectChat(chatId, peerId, peerName, peerAvatar) {
      activeChatId = chatId;
      activePeer = { uid: peerId, username: peerName, avatar: peerAvatar };

      document.getElementById('no-chat-selected').classList.add('hidden');
      document.getElementById('active-chat-container').classList.remove('hidden');
      document.getElementById('chat-area').classList.remove('translate-x-full');

      document.getElementById('chat-user-name').innerText = peerName;
      document.getElementById('chat-user-avatar').src = peerAvatar;

      listenToMessages(chatId);
    }

    function closeMobileChat() {
      document.getElementById('chat-area').classList.add('translate-x-full');
    }

    // Messages en temps réel
    function listenToMessages(chatId) {
      if (messagesUnsubscribe) messagesUnsubscribe();

      messagesUnsubscribe = db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot((snapshot) => {
          const container = document.getElementById('messages-list');
          container.innerHTML = '';

          snapshot.forEach((doc) => {
            const msg = doc.data();
            const isMe = msg.senderId === currentUser.uid;

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2`;

            let contentHtml = '';
            if (msg.image) {
              contentHtml += `<img src="${msg.image}" class="rounded-xl max-w-xs mb-1 border border-dark-border">`;
            }
            if (msg.text) {
              contentHtml += `<p class="text-xs leading-relaxed break-words">${escapeHtml(msg.text)}</p>`;
            }

            msgDiv.innerHTML = `
              <div class="max-w-[75%] ${isMe ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-xs' : 'bg-dark-card border border-dark-border text-zinc-200 rounded-2xl rounded-tl-xs'} px-4 py-2.5 shadow-sm">
                ${contentHtml}
                <span class="block text-[9px] ${isMe ? 'text-indigo-200' : 'text-zinc-500'} text-right mt-1">${msg.timestamp ? formatDate(msg.timestamp.toDate()) : ''}</span>
              </div>
            `;
            container.appendChild(msgDiv);
          });

          container.scrollTop = container.scrollHeight;
        });
    }

    // Envoi de message
    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (!text || !activeChatId) return;

      input.value = '';

      await db.collection('chats').doc(activeChatId).collection('messages').add({
        senderId: currentUser.uid,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      await db.collection('chats').doc(activeChatId).update({
        lastMessage: text,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // Envoi d'image
    async function sendImage(e) {
      const file = e.target.files[0];
      if (!file || !activeChatId) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Image = event.target.result;

        await db.collection('chats').doc(activeChatId).collection('messages').add({
          senderId: currentUser.uid,
          image: base64Image,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection('chats').doc(activeChatId).update({
          lastMessage: '📷 Image',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      };
      reader.readAsDataURL(file);
    }

    // Modal Nouveau Chat
    function openNewChatModal() {
      document.getElementById('new-chat-modal').classList.remove('hidden');
    }

    function closeNewChatModal() {
      document.getElementById('new-chat-modal').classList.add('hidden');
    }

    async function searchUsers() {
      const query = document.getElementById('search-user-modal').value.trim().toLowerCase();
      const container = document.getElementById('modal-users-list');

      if (!query) {
        container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">Saisissez un pseudo pour commencer la recherche.</p>`;
        return;
      }

      const snapshot = await db.collection('users')
        .where('username', '>=', query)
        .where('username', '<=', query + '\uf8ff')
        .get();

      if (snapshot.empty) {
        container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">Aucun utilisateur trouvé.</p>`;
        return;
      }

      let html = '';
      snapshot.forEach(doc => {
        const user = doc.data();
        if (user.uid !== currentUser.uid) {
          html += `
            <div onclick="startChatWith('${user.uid}', '${user.username}', '${user.avatar}')" class="flex items-center justify-between p-3 hover:bg-dark-hover rounded-xl cursor-pointer transition">
              <div class="flex items-center space-x-3">
                <img src="${user.avatar}" class="w-9 h-9 rounded-full bg-dark-border">
                <span class="text-xs font-semibold text-zinc-200">${user.username}</span>
              </div>
              <i class="fa-solid fa-comment-dots text-indigo-500 text-sm"></i>
            </div>
          `;
        }
      });
      container.innerHTML = html || `<p class="text-xs text-zinc-500 text-center py-4">Aucun autre utilisateur trouvé.</p>`;
    }

    async function startChatWith(peerUid, peerUsername, peerAvatar) {
      closeNewChatModal();

      // Vérifier si le chat existe déjà
      const existing = await db.collection('chats')
        .where('participants', 'array-contains', currentUser.uid)
        .get();

      let chatId = null;
      existing.forEach(doc => {
        if (doc.data().participants.includes(peerUid)) {
          chatId = doc.id;
        }
      });

      if (!chatId) {
        const newChat = await db.collection('chats').add({
          participants: [currentUser.uid, peerUid],
          lastMessage: '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        chatId = newChat.id;
      }

      selectChat(chatId, peerUid, peerUsername, peerAvatar);
    }

    // Utilitaires
    function formatDate(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function filterChats() {
      const q = document.getElementById('search-chat-input').value.toLowerCase();
      const items = document.querySelectorAll('#chats-list > div');
      items.forEach(item => {
        const name = item.querySelector('h4')?.innerText.toLowerCase() || '';
        item.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
